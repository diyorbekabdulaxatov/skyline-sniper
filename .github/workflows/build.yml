name: Build

# On every push: checks and tests, fetch and shrink the Poly Haven assets, build the game and
# the Android test APK. Only main publishes the GitHub Pages preview and the android-latest release;
# other branches keep their APK as a workflow artifact.
#   Preview: https://<owner>.github.io/skyline-sniper/
#   APK:     https://github.com/<owner>/skyline-sniper/releases/download/android-latest/skyline-sniper.apk

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Check, fetch assets and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Project checks
        run: npm run check

      - name: Type-check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Restore downloaded assets
        uses: actions/cache@v4
        with:
          path: .cache
          key: polyhaven-${{ hashFiles('assets.json', 'assets-src/**') }}
          restore-keys: polyhaven-

      - name: Fetch and shrink assets
        run: npm run assets

      - name: Restore downloaded animations
        uses: actions/cache@v4
        with:
          path: .cache/rocketbox
          key: rocketbox-${{ hashFiles('scripts/fetch-animations.mjs') }}
          restore-keys: rocketbox-

      - name: Fetch and convert Rocketbox animations
        run: npm run anims

      - name: Build
        run: npm run build

      - name: Upload the built game
        uses: actions/upload-artifact@v4
        with:
          name: game-dist
          path: dist/
          retention-days: 7

  pages:
    name: Publish the phone preview
    if: github.ref == 'refs/heads/main'
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist

      - name: Publish to the gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: dist
          force_orphan: true
          commit_message: Preview of ${{ github.sha }}

  android:
    name: Build the test APK
    needs: web
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VERSION_CODE: ${{ github.run_number }}
      VERSION_NAME: 0.1.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - uses: actions/download-artifact@v4
        with:
          name: game-dist
          path: dist

      - name: Create and configure the Android project
        run: npm run android

      - name: Build the APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk skyline-sniper.apk

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: skyline-sniper-apk
          path: skyline-sniper.apk
          retention-days: 14

      - name: Publish the "android-latest" pre-release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest --yes --cleanup-tag || true
          gh release create android-latest skyline-sniper.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Android test build $VERSION_NAME" \
            --notes "Test build from \`${GITHUB_REF_NAME}\` at ${GITHUB_SHA::7}, signed with the shared test key (android-signing/README.md)."
