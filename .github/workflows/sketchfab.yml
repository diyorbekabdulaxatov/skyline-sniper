name: Sketchfab models

# Downloads the test-only Sketchfab models in sketchfab.json with the SKETCHFAB_TOKEN secret,
# shrinks them for phones and keeps them as a workflow artifact with a report. Nothing here goes
# into the game, the APK or the Pages preview. Runs when the list or the script changes, or by hand.

on:
  push:
    paths:
      - sketchfab.json
      - scripts/fetch-sketchfab.mjs
      - .github/workflows/sketchfab.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sketchfab-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    name: Fetch and shrink Sketchfab models
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Restore downloaded models
        uses: actions/cache@v4
        with:
          path: .cache/sketchfab
          key: sketchfab-${{ hashFiles('sketchfab.json') }}
          restore-keys: sketchfab-

      - name: Fetch and shrink
        env:
          SKETCHFAB_TOKEN: ${{ secrets.SKETCHFAB_TOKEN }}
        run: node scripts/fetch-sketchfab.mjs

      - name: Keep the shrunk models
        uses: actions/upload-artifact@v4
        with:
          name: sketchfab-models
          path: .cache/sketchfab-out/
          retention-days: 14
